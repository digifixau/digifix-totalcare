name: Build & release

# Every push / PR: lint the plugin, build the WordPress.org package and run
# Plugin Check on it.
# Pushing a tag like v1.2.1: also publish the zip as a GitHub Release and,
# once the SVN_USERNAME / SVN_PASSWORD secrets are set (after WordPress.org
# approves the plugin), deploy it to the WordPress.org plugin directory.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SVN: ${{ secrets.SVN_USERNAME != '' && secrets.SVN_PASSWORD != '' }}
    defaults:
      run:
        working-directory: digifix-totalcare
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 7.4 (oldest supported version)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2
          coverage: none

      - name: Lint PHP
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l > /dev/null

      - name: Check the version numbers match
        run: |
          HEADER=$(grep -Po '^\s*\*\s*Version:\s*\K[0-9][^\s]*' digifix-totalcare.php)
          CONST=$(grep -Po "define\(\s*'DIGIFIX_TC_VERSION',\s*'\K[^']+" digifix-totalcare.php)
          STABLE=$(grep -Po '^Stable tag:\s*\K[^\s]+' readme.txt)
          echo "header=$HEADER constant=$CONST stable=$STABLE"
          if [ "$HEADER" != "$CONST" ] || [ "$HEADER" != "$STABLE" ]; then
            echo "::error::The Version header ($HEADER), DIGIFIX_TC_VERSION ($CONST) and the readme.txt Stable tag ($STABLE) must match."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$HEADER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the plugin version $HEADER."
            exit 1
          fi

      - name: Install production dependencies (dompdf)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Build the WordPress.org package
        working-directory: .
        run: |
          mkdir -p build/digifix-totalcare
          rsync -a --exclude-from=digifix-totalcare/.distignore digifix-totalcare/ build/digifix-totalcare/
          (cd build && zip -qr ../digifix-totalcare.zip digifix-totalcare)
          unzip -l digifix-totalcare.zip | tail -1

      - name: Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/digifix-totalcare

      - uses: actions/upload-artifact@v4
        with:
          name: digifix-totalcare
          path: digifix-totalcare.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" digifix-totalcare.zip \
            --title "Digifix TotalCare ${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Deploy to WordPress.org
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SVN == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: digifix-totalcare
          BUILD_DIR: build/digifix-totalcare
          ASSETS_DIR: .wordpress-org
